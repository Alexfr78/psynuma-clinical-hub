            </div>
<div class="bg-surface-container-low border border-surface-variant/50 rounded-full px-sm py-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px] text-secondary">assignment</span>
<span class="font-label-md text-label-md text-on-surface-variant">Inventario de Evaluación de la Personalidad (PAI)</span>
</div>
</header>
<!-- Progress Area -->
<div class="flex flex-col gap-xs w-full mt-lg">
<div class="flex justify-between items-end w-full">
<span class="font-label-md text-label-md text-primary">Progreso</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Pregunta 12 de 40</span>
</div>

</div>

                En las últimas semanas, ¿con qué frecuencia se ha sentido abrumado por sus responsabilidades?
            </h1>
<!-- Likert Scale Options -->
<!-- Using grid for better equal distribution on desktop, fallback to flex col on mobile -->
<div class="grid grid-cols-1 sm:grid-cols-5 gap-sm w-full mt-md">
<button class="group flex flex-col items-center justify-center py-md px-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low hover:border-primary/50 hover:shadow-sm hover:text-primary transition-all duration-200">
<span class="font-label-md text-label-md group-hover:scale-105 transition-transform">Nunca</span>
</button>
<button class="group flex flex-col items-center justify-center py-md px-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low hover:border-primary/50 hover:shadow-sm hover:text-primary transition-all duration-200">

</button>

<span class="font-label-md text-label-md scale-105">A veces</span>

<span class="font-label-md text-label-md group-hover:scale-105 transition-transform">Siempre</span>
</button>
</div>
</div>
